    - generic [ref=f1e71]:
      - tab [ref=f1e210]:
        - heading [level=6] [ref=f1e211]:
          - button " 9. How do banks make money on structured products?" [expanded] [active] [ref=f1e212] [cursor=pointer]
      - tabpanel " 9. How do banks make money on structured products?" [ref=f1e213]:
        - generic [ref=f1e214]:
          - paragraph [ref=f1e215]: Structured products are securities structured and issued by banks. Issuing a structured product is different from selling one. The bank typically issues the structured product and distributes it, but there are also distribution partners, independent from the banks, that advise investors on structured products and earn money on sales. For this reason, a distinction needs to be made between the issuer and the distributor when looking at profits. It is important for retail investors to know how much they are paying the issuer for the structuring of the structured product. On top of structuring costs, there are the distribution costs and fees incurred in the buying or selling of a structured product.
          - paragraph [ref=f1e216]: Issuer margin
          - paragraph [ref=f1e217]: Regardless of where and how an investor buys a structured product, the price always exceeds the expected issuer margin. It is important to note that this margin is not the same as the issuer’s net profit. The expected issuer margin includes the expected profit but it also covers all the issuer’s operational costs. These include, for example, personnel costs, exchange listing fees and/or trading system expenses.
          - paragraph [ref=f1e218]: Bid-ask spread
          - paragraph [ref=f1e219]: Retail investors wishing to buy a structured product after the subscription period or to sell it before maturity, either on an exchange or directly over-the-counter, can find out the value of the structured product at any time during exchange trading hours. The issuers also continuously quote bid and ask prices at which trading is possible in over-the-counter trading. The bid price is always equal to the selling price and the ask price is equivalent to the purchase price of a structured product.
          - paragraph [ref=f1e220]: Exchange fees, transaction costs and securities account charges
          - paragraph [ref=f1e221]: All investors, whether advised or self-directed, need a securities account with a bank or an online broker for every financial instrument they buy. This means they incur securities account charges in addition to transaction costs for buying and selling any type of security.
    - generic [ref=f1e75]:
      - tab [ref=f1e204]:
        - heading [level=6] [ref=f1e205]:
          - button " 10. Are banks betting against structured product investors?" [expanded] [ref=f1e206] [cursor=pointer]
      - tabpanel " 10. Are banks betting against structured product investors?" [ref=f1e207]:
        - paragraph [ref=f1e209]: When a retail investor buys a structured product, the bank is never their rival. The bank that issues the product actually enables the customer to invest based on a certain market trend. The bank itself adopts a risk-neutral position and hedges its payout obligation by engaging in countertrading on the capital market. It is of no importance to the bank whether the investor is investing based on rising, falling or sideways markets - the issuer only makes money from the structuring of the financial instrument and from trading in that product.
