  - button "FAQs about Structured Products )" [ref=f1e27] [cursor=pointer]
  - paragraph [ref=f1e34]: Structured products, known for their variations and multi-faceted strategies, frequently spark enquiries. Here are some FAQs covering common topics.
  - tablist [ref=f1e38]:
    - tab [ref=f1e40]:
      - heading [level=6] [ref=f1e41]:
        - button " 1. What is a structured product?" [ref=f1e42] [cursor=pointer]
