        - article [ref=f2e42]:
          - heading [level=1] [ref=f2e43]:
            - link "The average cost of retail investment products declines but significant differences across EU Member States remain" [ref=f2e44] [cursor=pointer]:
              - /url: /press-news/esma-news/average-cost-retail-investment-products-declines-significant-differences
          - generic [ref=f2e46]:
            - generic [ref=f2e47]: Fund Management
            - generic [ref=f2e48]: Press Releases
            - generic [ref=f2e49]: Risk monitoring
          - generic [ref=f2e50]: 18/12/2023
          - generic [ref=f2e51]:
            - paragraph [ref=f2e53]:
              - text: The European Securities and Markets Authority (ESMA), the EU financial markets regulator and supervisor, today publishes its
              - link "sixth market report" [ref=f2e54] [cursor=pointer]:
                - /url: /sites/default/files/2023-12/ESMA50-524821-3052_Market_Report_on_Costs_and_Performance_of_EU_Retail_Investment_Products.pdf
              - text: on the costs and performance of EU retail investment products. In this annual report ESMA finds that the average costs of investing in key EU retail financial products has declined by the end of 2022. However, cost heterogeneity persisted across EU Member States.
            - generic [ref=f2e55]:
              - paragraph [ref=f2e56]: "Verena Ross, ESMA Chair, said:"
              - heading "“ESMA’s annual reporting on the costs and performance of retail investment products provides a clear overview and shows developments across the EU markets. Costs and performance are key determinants of whether retail investors benefit from their investments, and whilst it is to be welcomed that the cost incurred by investors has slowly declined, retail investors still need to consider costs carefully in their investment decisions.”" [level=6] [ref=f2e57]
              - heading "“In 2022, investors were faced with a difficult environment characterised by lower returns and elevated level of inflation, accentuating the importance of the level of costs. Clear, comprehensive and comparable information on retail investment products can help investors assess the past performance and costs of products offered across the EU and assist them in making well-informed investment choices.”" [level=6] [ref=f2e58]
              - paragraph [ref=f2e59]: "The key findings in the report are:"
              - list [ref=f2e60]:
                - listitem [ref=f2e61]:
                  - text: "-"
                  - strong [ref=f2e62]: UCITS Costs
                  - text: ": Costs have declined, but investors should continue to consider fund fees carefully in their investment decisions. Despite costs of active equity funds decreasing, this category of funds remained more expensive than passive funds and ETFs, such that their net performance was on average lower in comparison."
                - listitem [ref=f2e63]:
                  - text: "-"
                  - strong [ref=f2e64]: Investment value and value-for-money
                  - text: ": Investors paid around 2,000€ in costs for an investment in UCITS of 10,000€ over ten years. The returns of the market led to a net value of 14,850€ after this period, and to a net real value of 13,500€, when inflation is taken into account."
                - listitem [ref=f2e65]:
                  - text: "-"
                  - strong [ref=f2e66]: ESG UCITS
                  - text: ": ESG funds underperformed on average their non-ESG equivalents in 2022, a likely consequence of the energy crisis. However, ESG funds still outperformed their non-ESG equivalents on the three-year investment horizon. In 2022, ongoing costs of ESG funds were lower than or similar to the ongoing costs of non-ESG equivalents."
                - listitem [ref=f2e67]:
                  - text: "-"
                  - strong [ref=f2e68]: Alternative Investment Funds (AIFs)
                  - text: ": The market for AIFs remained dominated by professional investors with the share of retail investors reaching around 14% at the end of 2022. Retail investors invested mainly in funds of funds, “other” AIFs and real estate funds. Among those three categories of funds, real estate funds were the only category with positive gross and net returns in 2022. However, real estate markets face significant challenges since 2022, which is likely to affect the performance of real estate funds going forward, given the further increase of interest rates in 2023."
                - listitem [ref=f2e69]:
                  - text: "-"
                  - strong [ref=f2e70]: "Structured Retail Products (SRPs):"
                  - text: Costs, largely charged in the form of entry costs, rose in 2022 for a majority of product types and issuers, although they vary substantially by payoff type and country. The analysis of performance scenarios shows that the returns of one in eight SRPs would be negative even in a moderate scenario.
              - paragraph [ref=f2e71]: Costs and performance of retail investment products are key determinants of the benefits for retail investors in the EU. Clear and comprehensive information on retail investment products can help investors assess the past performance and costs of products offered across the EU and foster retail investor participation in capital markets.
              - paragraph [ref=f2e72]: ESMA’s report helps to monitor progress in this regard by providing consistent EU-wide information on cost and performance of retail investment products. It also demonstrates the relevance of disclosure of costs to investors, as required by the MiFID II, UCITS and PRIIPs rules and the need for asset managers and investment firms to act in the best interest of investors, as laid down in MiFID II, and the UCITS and AIFM Directives.
              - heading [level=4] [ref=f2e73]:
                - strong [ref=f2e74]: Webinar
              - paragraph [ref=f2e75]:
                - text: ESMA is organising together with the European Insurance and Occupational Pensions Authority (EIOPA) a joint webinar “
                - link "ESMA’s and EIOPA’s Annual Cost and Past Performance Report" [ref=f2e76] [cursor=pointer]:
                  - /url: /press-news/hearings/webinar-esmas-and-eiopas-annual-cost-and-past-performance-report
                - text: "” to share the findings of:"
              - list [ref=f2e77]:
                - listitem [ref=f2e78]:
                  - text: "-"
                  - link "ESMA’s Market Report on Costs and Performance of EU Retail Investment Products" [ref=f2e79] [cursor=pointer]:
                    - /url: https://www.esma.europa.eu/sites/default/files/2023-12/ESMA50-524821-3052_Market_Report_on_Costs_and_Performance_of_EU_Retail_Investment_Products.pdf
                - listitem [ref=f2e80]:
                  - text: "-"
                  - link "EIOPA’s Report on Costs and Past Performances" [ref=f2e81] [cursor=pointer]:
                    - /url: https://www.eiopa.europa.eu/publications/costs-and-past-performance-report-december-2023_en
              - paragraph [ref=f2e82]:
                - text: The webinar will be held online on
                - strong [ref=f2e83]: 10 January 2024, 10:30 – 11:30 CET
                - text: .
              - paragraph [ref=f2e84]
              - paragraph [ref=f2e85]: "Further information:"
              - heading [level=6] [ref=f2e86]:
                - strong [ref=f2e87]: Solveig Kleiveland
              - paragraph [ref=f2e88]:
                - text: "Communications Team Leader@ Email:"
                - link "press@esma.europa.eu" [ref=f2e89] [cursor=pointer]:
                  - /url: mailto:press@esma.europa.eu
