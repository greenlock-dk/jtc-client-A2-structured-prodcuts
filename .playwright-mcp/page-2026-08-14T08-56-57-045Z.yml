    - text: "The bank or intermediary identified as holding, administering, or appearing against the position. This is an evidence attribute and does not by itself prove beneficial ownership or the amount held. The product grouping used to select a comparable cost observation. Cohort membership is an analytical classification and does not establish that the products have identical terms or economics. The country linked to the issuer, product, or supporting evidence. It supports jurisdictional comparability but does not identify the distribution channel or governing law unless those are separately documented. The currency in which the denomination, payoff, or payment is expressed. Currency affects comparability and conversion, so a displayed USD amount may still represent a foreign-currency exposure. The source workbook or presentation sequence retained for stable review ordering. It carries no economic, risk, or priority meaning. The upper end of the cost range produced only from comparators that meet the adoption rules for the relevant cohort. It is a bounded evidence scenario, not a complete lifetime-cost estimate where transaction, service, or exit evidence is missing. The lower end of the cost range produced only from comparators that meet the adoption rules for the relevant cohort. It excludes unsupported components and must not be interpreted as proof that the amount was charged or paid. The elapsed period between the documented purchase basis and the modelled end event, expressed in years. It compounds or accumulates annualised comparators for relevant products, but does not turn a one-off issuance comparator into a recurring cost. The unique identifier used to join the product across dossiers, evidence, and generated views. It is the most reliable way to trace a row back to its source record. The reported date on which the security was issued. It anchors vintage and regulatory-regime comparisons, but does not establish the Trust acquisition date. The issuer-reported total issuance or outstanding amount. It describes the security programme or issuance, not the Trust's investment, and must not replace a usable position amount. The entity named as issuer in the product evidence. Issuer identity helps assess credit and jurisdictional context, but does not identify every distributor, guarantor, or compensation recipient. The earliest documented end event used by the model, normally a contractual call or scheduled maturity. It should not be read as proof that the security was actually held until that date. The documented maturity, call, or other contractual lifecycle terms. A call feature may end the modelled lifecycle earlier than scheduled maturity, but neither date proves the realised holding outcome. States whether the proxy is embedded-only, includes other modelled groups, unbenchmarked, or not calculated. It prevents an unmodelled group from being read as evidence of zero cost. The one-off or product-cost proxy used as the controlling embedded component. A displayed range preserves the source-supported range rather than inventing a midpoint. The contingent exit and transaction component. Zero means no exit scenario is currently modelled. The annual investment-service proxy accumulated over the valid holding period so that it can be added to the one-off embedded and assumed-exit components in the displayed total. The reconciled lifetime proxy total calculated as embedded product proxy plus recurring service proxy over the holding period plus the assumed exit and transaction proxy. Its displayed components must sum to this amount. Canonical YAML field: purchase_date. The usable Trust-reported amount converted or recorded in US dollars for scenario calculations. It is an exposure basis, not evidence of purchase price, current balance, fee payment, or lifetime holding. The displayed product name, supplemented by its structure where a name is unavailable. It is a navigation label, not a complete description of the payoff or risk. The instrument or payoff family assigned to the product. It provides the starting point for cohort analysis, but similar labels can conceal materially different barriers, underlyings, calls, or loss mechanics. Whether a term sheet or equivalent primary product document has been located. Availability supports further verification but does not mean the document has been fully reviewed or that all fields are confirmed. The Trust, account, or portfolio context associated with the record. It identifies the ownership or review context being analysed, but does not by itself prove a position amount or transaction history."
